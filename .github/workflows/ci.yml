name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias de desarrollo
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Verificar versiones
        run: python scripts/check_version.py
      - name: Tests
        run: python -m pytest -q
      - name: Ruff
        run: ruff check --select E9,F app_settings.py app_icon.py app_version.py dsp.py protocol.py update_checker.py scripts tests

  build-linux:
    name: Build Linux (PyInstaller)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libxcb-cursor0 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfuse2
      - name: Dependencias Python
        run: python -m pip install --upgrade pip && pip install pyinstaller -r requirements.txt
      - name: Verificar PySide6
        run: |
          python -c "import sys, PySide6; v=tuple(map(int, PySide6.__version__.split('.')[:2])); print('PySide6', PySide6.__version__, '| Python', sys.version.split()[0]); assert not (v >= (6, 12) and sys.version_info < (3, 12)), 'PySide6 >= 6.12 causa bool_dealloc en Python < 3.12'"
      - name: Empaquetar
        run: pyinstaller --noconfirm --onedir --windowed --add-data "foid.png:." --name speakerphone-usb speakerphone_linux.py
