name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias de desarrollo
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Verificar versiones
        run: python scripts/check_version.py
      - name: Tests
        run: python -m pytest -q
      - name: Ruff
        run: ruff check --select E9,F app_settings.py app_icon.py app_version.py audio_capture.py dsp.py protocol.py update_checker.py updater.py update_window_qt.py theme.py app_theme_qt.py speakerphone_linux.py speakerphone_win.py speakerphone_mac.py scripts tests
      - name: Generar SBOM
        run: cyclonedx-py requirements -o sbom.json requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias de runtime
        run: python -m pip install --upgrade pip && pip install -r requirements-build.txt -r requirements.txt pip-audit==2.10.1
      - name: pip check
        run: python -m pip check
      - name: pip-audit
        run: python -m pip_audit

  build-linux:
    name: Build Linux (PyInstaller)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libxcb-cursor0 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfuse2
      - name: Dependencias Python
        run: python -m pip install --upgrade pip && pip install -r requirements-build.txt -r requirements.txt
      - name: Verificar dependencias
        run: python -m pip check
      - name: Verificar PySide6
        run: |
          python -c "import sys, PySide6; v=tuple(map(int, PySide6.__version__.split('.')[:2])); print('PySide6', PySide6.__version__, '| Python', sys.version.split()[0]); assert not (v >= (6, 12) and sys.version_info < (3, 12)), 'PySide6 >= 6.12 causa bool_dealloc en Python < 3.12'"
      - name: Empaquetar
        run: pyinstaller --noconfirm --onedir --windowed --add-data "foid.png:." --name speakerphone-usb speakerphone_linux.py
