name: Build & Release Multi-OS
'on':
  push:
    tags:
    - v*
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          artifact_name: SpeakerPhone-USB-Linux-x86_64.AppImage
          entry_script: speakerphone_linux.py
        - os: windows-latest
          artifact_name: SpeakerPhone-USB-Windows-x86_64.exe
          entry_script: speakerphone_win.py
        - os: macos-latest
          artifact_name: SpeakerPhone-USB-macOS-arm64
          entry_script: speakerphone_mac.py
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Deps Linux
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libportaudio2 libxcb-cursor0
        libegl1 libxkbcommon-x11-0 libdbus-1-3 libfuse2
    - name: Deps macOS
      if: runner.os == 'macOS'
      run: brew install portaudio
    - name: Deps Python
      run: python -m pip install --upgrade pip && pip install pyinstaller -r requirements.txt
    - name: Build Win/Mac
      if: runner.os != 'Linux'
      shell: bash
      run: pyinstaller --noconfirm --onefile --windowed --name "${{ matrix.artifact_name
        }}" "${{ matrix.entry_script }}"
    - name: Build Linux AppImage
      if: runner.os == 'Linux'
      shell: bash
      run: 'pyinstaller --noconfirm --onedir --windowed --name speakerphone-usb "${{
        matrix.entry_script }}"

        mkdir -p AppDir/usr/bin

        cp -r dist/speakerphone-usb/* AppDir/usr/bin/

        printf "[Desktop Entry]\nVersion=1.0\nType=Application\nName=SpeakerPhone-USB\nExec=speakerphone-usb\nIcon=speakerphone-usb\nCategories=AudioVideo;Audio;\nTerminal=false\n"
        > AppDir/speakerphone-usb.desktop

        printf ''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"
        viewBox="0 0 64 64"><rect x="6" y="6" width="52" height="52" rx="14" fill="#22C55E"/><text
        x="32" y="40" font-family="sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF"
        text-anchor="middle">USB</text></svg>'' > AppDir/speakerphone-usb.svg
        cp AppDir/speakerphone-usb.svg AppDir/.DirIcon
        mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
        cp AppDir/speakerphone-usb.svg AppDir/usr/share/icons/hicolor/scalable/apps/speakerphone-usb.svg

        printf "#!/bin/bash\nHERE=\$(dirname \$(readlink -f \$0))\nexport PATH=\$HERE/usr/bin:\$PATH\nexport
        LD_LIBRARY_PATH=\$HERE/usr/bin:\$LD_LIBRARY_PATH\nexec \$HERE/usr/bin/speakerphone-usb
        \$@\n" > AppDir/AppRun

        chmod +x AppDir/AppRun

        wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage

        chmod +x appimagetool-x86_64.AppImage

        APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool-x86_64.AppImage --no-appstream
        AppDir "dist/${{ matrix.artifact_name }}"

        chmod +x "dist/${{ matrix.artifact_name }}"'
    - name: Zip macOS
      if: runner.os == 'macOS'
      run: cd dist && zip -r "${{ matrix.artifact_name }}.zip" "${{ matrix.artifact_name
        }}.app"
    - name: Upload Win/Linux
      if: runner.os != 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ runner.os }}
        path: dist/${{ matrix.artifact_name }}
    - name: Upload macOS
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ runner.os }}
        path: dist/${{ matrix.artifact_name }}.zip
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SpeakerPhone-USB-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SpeakerPhone-USB-Android.apk
  release:
    name: Publicar GitHub Release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    - uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        body: |
          ### Novedades en v4.0.14

          - **Logs persistentes en disco (Linux, Windows y macOS):** todas las líneas del visor de registros se guardan en `speakerphone.log` con rotación de 2 MB por archivo (5 copias). Ubicaciones: `~/.local/state/SpeakerPhone-USB/logs/` en Linux, `%LOCALAPPDATA%\SpeakerPhone-USB\logs\` en Windows y `~/Library/Logs/SpeakerPhone-USB/` en macOS. Se puede cambiar con la variable `SPEAKERPHONE_LOG_DIR`.
          - **Diagnóstico de fallos:** se registran las excepciones no controladas del hilo principal y de los hilos de trabajo, junto con información del sistema y versión de Python al arrancar.
          - **Acceso rápido:** nuevo botón **“Abrir carpeta”** en el visor de logs de las tres aplicaciones de escritorio. Si la carpeta preferida no es escribible, se usa una ubicación temporal como respaldo.
        files: artifacts/*
