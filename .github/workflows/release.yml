name: Build & Release Multi-OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: SpeakerPhone-USB-Linux-x86_64
            entry_script: speakerphone_linux.py
          - os: windows-latest
            artifact_name: SpeakerPhone-USB-Windows-x86_64.exe
            entry_script: speakerphone_win.py

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libxcb-cursor0 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Compilar binario con PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name "${{ matrix.artifact_name }}" \
            "${{ matrix.entry_script }}"

      - name: Subir artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Publicar GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Descargar todos los binarios compilados
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Crear Release y adjuntar ejecutables
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
