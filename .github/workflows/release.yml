name: Build & Release Multi-OS
'on':
  push:
    tags:
    - v*
    - '[0-9]*'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          artifact_name: SpeakerPhone-USB-Linux-x86_64.AppImage
          entry_script: speakerphone_linux.py
        - os: windows-latest
          artifact_name: SpeakerPhone-USB-Windows-x86_64.exe
          entry_script: speakerphone_win.py
        - os: macos-latest
          artifact_name: SpeakerPhone-USB-macOS-arm64
          entry_script: speakerphone_mac.py
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Deps Linux
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libportaudio2 libxcb-cursor0
        libegl1 libxkbcommon-x11-0 libdbus-1-3 libfuse2
    - name: Deps macOS
      if: runner.os == 'macOS'
      run: brew install portaudio
    - name: Deps Python
      run: python -m pip install --upgrade pip && pip install pyinstaller -r requirements.txt
    - name: Verificar version de PySide6
      run: |
        python -c "import sys, PySide6; v=tuple(map(int, PySide6.__version__.split('.')[:2])); print('PySide6', PySide6.__version__, '| Python', sys.version.split()[0]); assert not (v >= (6, 12) and sys.version_info < (3, 12)), 'PySide6 >= 6.12 con Python < 3.12 causa bool_dealloc en Signal.emit()'"
    - name: Verificar version del tag
      if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
      run: python scripts/check_version.py "${{ github.ref_name }}"
    - name: Build Win/Mac
      if: runner.os != 'Linux'
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then ICON="foid.ico"; else ICON="foid.icns"; fi
        pyinstaller --noconfirm --onefile --windowed --add-data "foid.png:." --icon "$ICON" --name "${{ matrix.artifact_name }}" "${{ matrix.entry_script }}"
    - name: Build Linux AppImage
      if: runner.os == 'Linux'
      shell: bash
      run: 'pyinstaller --noconfirm --onedir --windowed --add-data "foid.png:."
        --name speakerphone-usb "${{ matrix.entry_script }}"

        mkdir -p AppDir/usr/bin

        cp -r dist/speakerphone-usb/* AppDir/usr/bin/

        printf "[Desktop Entry]\nVersion=1.0\nType=Application\nName=SpeakerPhone-USB\nExec=speakerphone-usb\nIcon=speakerphone-usb\nCategories=AudioVideo;Audio;\nTerminal=false\n"
        > AppDir/speakerphone-usb.desktop

        cp foid.png AppDir/speakerphone-usb.png

        cp foid.png AppDir/.DirIcon

        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

        cp foid.png AppDir/usr/share/icons/hicolor/256x256/apps/speakerphone-usb.png

        printf "#!/bin/bash\nHERE=\$(dirname \$(readlink -f \$0))\nexport PATH=\$HERE/usr/bin:\$PATH\nexport
        LD_LIBRARY_PATH=\$HERE/usr/bin:\$LD_LIBRARY_PATH\nexec \$HERE/usr/bin/speakerphone-usb
        \$@\n" > AppDir/AppRun

        chmod +x AppDir/AppRun

        wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage

        chmod +x appimagetool-x86_64.AppImage

        APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool-x86_64.AppImage --no-appstream
        AppDir "dist/${{ matrix.artifact_name }}"

        chmod +x "dist/${{ matrix.artifact_name }}"'
    - name: Zip macOS
      if: runner.os == 'macOS'
      run: cd dist && zip -r "${{ matrix.artifact_name }}.zip" "${{ matrix.artifact_name
        }}.app"
    - name: Upload Win/Linux
      if: runner.os != 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ runner.os }}
        path: dist/${{ matrix.artifact_name }}
    - name: Upload macOS
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ runner.os }}
        path: dist/${{ matrix.artifact_name }}.zip
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          PATCH=${PATCH:-0}
          echo "VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))" >> "$GITHUB_ENV"
      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Prepare Android SDK licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../SpeakerPhone-USB-Android.apk
          else
            echo "::warning::Sin keystore configurado; se publica un APK debug."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../SpeakerPhone-USB-Android.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SpeakerPhone-USB-Android.apk
  release:
    name: Publicar GitHub Release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    - name: Generar checksums SHA-256
      run: |
        cd artifacts
        find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
          | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
        cat SHA256SUMS.txt
    - uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        body: |
          ### Novedades en 0.19

          - **Protocolo v1 (actualiza PC y Android juntos):** el handshake ahora incluye magic, versión y `chunk_ms`. Android lee exactamente el tamaño de paquete que envía el PC, en lugar de usar 10 ms fijos. Los binarios 0.19 no son compatibles con APKs antiguos ni viceversa.
          - **DSP compartido y vectorizado:** ganancia, limitador suave y medidor usan NumPy en las tres apps de PC, eliminando el bucle muestra por muestra de Linux (importante a 96 kHz).
          - **Ajustes persistentes:** perfil de búfer, fuente, frecuencia, ganancia, limitador y dispositivo de audio se restauran al reiniciar.
          - **Android más robusto:** audio focus (pausa al usar otra app el audio), reconstrucción de `AudioTrack` al cambiar la salida USB/Bluetooth, WakeLock sin caducidad de 6 h y botón **Buscar actualizaciones** que consulta GitHub y abre la descarga.
          - **Diagnóstico de conexión:** mejores mensajes de protocolo y preferencia por el dispositivo ADB listo cuando hay varios conectados.
          - **Limpieza:** el sink virtual huérfano de Linux se libera al arrancar; corregido el filtro CoreAudio de macOS.
          - **CI y calidad:** tests de protocolo/DSP/ajustes/updates, validación de versión contra el tag, checksums SHA-256 en el release y build Linux en cada PR. El APK se firma con keystore si están configurados los secrets `ANDROID_KEYSTORE_*`; si no, se mantiene el APK debug con aviso.
          - **Versión visible:** `v0.19` en las apps de PC y en Android.
        files: artifacts/*
